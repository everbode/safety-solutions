<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safety Alert Admin | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="admin.html">SAFETY <span>SOLUTIONS</span></a><nav class="navlinks"><a class="btn small" href="admin.html">Moderação</a><a class="btn small" href="safety-alert.html">Ver alertas</a><a class="btn small" href="dashboard.html">Painel</a></nav></div></header><main class="container"><div class="page-title"><span class="eyebrow">MODERAÇÃO • SAFETY ALERT</span><h1>⚠️ Registros e contestações</h1><p class="muted">Crie alertas apenas após verificar fatos, vínculo da operação e documentação disponível.</p></div><div id="msg" class="notice hidden"></div><div id="content"><div class="panel"><h2>Novo alerta verificado</h2><form id="form" class="form-grid"><div class="full"><label>Usuário / instituição citada</label><select id="subject" required></select></div><div><label>ID da transação relacionada</label><input id="transaction" type="number" min="1"></div><div><label>Tipo do incidente</label><input id="incident" placeholder="Ex.: não cumprimento de entrega" required></div><div><label>Valor relacionado (HC)</label><input id="amount" type="number" min="0"></div><div class="full"><label>Descrição factual</label><textarea id="description" required></textarea></div><div class="full"><label>Referência de evidência</label><input id="evidence" placeholder="ID de operação, link, protocolo ou descrição da evidência" required></div><div class="full"><label>Decisão administrativa</label><textarea id="decision" required></textarea></div><div class="full"><button class="btn primary">Publicar alerta</button></div></form></div><section class="section"><div class="section-head"><span class="gold">CONTESTAÇÕES</span><h2>Pendentes de análise</h2></div><div id="contests" class="grid cols2"></div></section></div></main><script>let me=null;async function load(){try{const db=Safety.db();me=await Safety.requireUser();const{data:mod}=await db.from("moderators").select("user_id,role").eq("user_id",me.id).maybeSingle();const levels={auditor:10,moderator:20,admin:30,owner:40};if(!mod||!(levels[mod.role]>=20)){Safety.msg(msg,"⛔ Safety Alert exige nível Moderador ou superior.","error");content.classList.add("hidden");return}const[{data:profiles},{data:cs}]=await Promise.all([db.from("profiles").select("id,username,institution").order("username"),db.from("alert_contests").select("*").eq("status","pending").order("created_at",{ascending:true})]);subject.innerHTML='<option value="">Selecione</option>'+(profiles||[]).map(p=>'<option value="'+p.id+'">'+p.username+(p.institution?' • '+p.institution:'')+'</option>').join("");contests.innerHTML=(cs||[]).length?(cs||[]).map(c=>'<article class="card"><span class="tag warn">contestada</span><h3>Alerta #'+c.alert_id+'</h3><p>'+c.statement+'</p><p class="muted">Contestação #'+c.id+' • '+Safety.date(c.created_at)+'</p><div class="actions"><button class="btn primary small" onclick="resolve('+c.alert_id+',\'active\')">Manter alerta</button><button class="btn small" onclick="resolve('+c.alert_id+',\'resolved\')">Marcar resolvido</button><button class="btn danger small" onclick="resolve('+c.alert_id+',\'withdrawn\')">Retirar alerta</button></div></article>').join(""):'<div class="card"><p class="muted">Nenhuma contestação pendente.</p></div>'}catch(e){if(e.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else if(e.message!=="AUTH_REQUIRED")Safety.msg(msg,"❌ "+e.message,"error")}}form.addEventListener("submit",async e=>{e.preventDefault();try{const args={p_subject:subject.value,p_transaction:transaction.value?Number(transaction.value):null,p_incident_type:incident.value.trim(),p_amount:amount.value?Number(amount.value):null,p_description:description.value.trim(),p_evidence_reference:evidence.value.trim(),p_decision:decision.value.trim()};const{data,error}=await Safety.db().rpc("moderator_create_safety_alert",args);if(error)throw error;alert("Alerta #"+data+" publicado.");form.reset();load()}catch(e){alert("Erro: "+e.message)}});async function resolve(id,status){const note=prompt("Registre a fundamentação da decisão:");if(!note)return;try{const{error}=await Safety.db().rpc("moderator_resolve_alert",{p_alert_id:id,p_final_status:status,p_resolution:note});if(error)throw error;load()}catch(e){alert("Erro: "+e.message)}}load();</script></body></html>
