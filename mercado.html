<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercado | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><style>.featured-card{box-shadow:0 0 0 1px #e3a82f inset}.featured-badge{margin-left:6px}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html">SAFETY <span>SOLUTIONS</span></a><nav class="navlinks"><a class="btn small" href="dashboard.html">Painel</a><a class="btn small" href="negociacoes.html">Negociações</a><a class="btn primary small" href="nova-oferta.html">+ Oferta</a></nav></div></header><main class="container"><div class="page-title"><span class="eyebrow">MERCADO</span><h1>🛒 Ofertas abertas</h1><p class="muted">Compra direta ou contraproposta. O valor fica em custódia até a conclusão da operação.</p></div><div id="msg" class="notice hidden"></div><div id="feeNotice" class="notice"></div><section class="sponsor-zone"><span class="sponsor-label">Patrocinado</span><div data-sponsor-placement="market"></div></section><div class="inline" style="margin-bottom:22px"><select id="filter" style="max-width:240px"><option value="">Todos os produtos</option><option>Ouro</option><option>Petróleo</option><option>Couro</option><option>TRM</option></select><button class="btn" id="reload">Atualizar</button></div><div id="market" class="grid cols3"></div></main><script>
let rows=[],me=null,fees={};
async function load(){
 try{
  const db=Safety.db();me=await Safety.requireUser();
  const[{data,error},{data:feeData,error:feeErr}]=await Promise.all([db.rpc("market_listings"),db.rpc("platform_fee_schedule")]);
  if(error)throw error;if(feeErr)throw feeErr;
  rows=data||[];fees=Object.fromEntries((feeData||[]).map(x=>[x.fee_key,x]));
  renderFeeNotice();render();
 }catch(err){if(err.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else if(err.message!=="AUTH_REQUIRED")Safety.msg(msg,"❌ "+err.message,"error")}
}
function renderFeeNotice(){
 const tx=fees.market_transaction,feat=fees.featured_listing;
 const parts=[];
 if(tx)parts.push("Taxa da Safety: "+(tx.rate_bps/100).toLocaleString("pt-BR")+"% sobre a venda concluída, descontada do valor recebido pelo vendedor.");
 if(feat)parts.push("Destaque: "+Safety.hc(feat.fixed_amount)+" por "+feat.duration_hours+"h.");
 feeNotice.textContent="💼 "+parts.join(" ");
}
function render(){
 const f=filter.value;const list=rows.filter(x=>!f||x.product===f);
 market.innerHTML=list.length?list.map(x=>{
   const featured=x.is_featured;
   const own=x.seller_id===me.id;
   let actions="";
   if(own){
     const feat=fees.featured_listing;
     if(feat)actions='<button class="btn primary small" onclick="promote('+x.id+')">⭐ Destacar '+feat.duration_hours+'h</button>';
   }else{
     actions='<button class="btn primary small" onclick="buy('+x.id+')">Comprar</button><button class="btn small" onclick="counter('+x.id+')">Contraproposta</button>';
   }
   return '<article class="card market-card '+(featured?'featured-card':'')+'"><div class="inline"><span class="tag '+(x.status==="available"?"ok":"warn")+'">'+x.status+'</span>'+(featured?'<span class="tag warn featured-badge">⭐ destaque</span>':'')+'</div><h3>'+x.product+'</h3><p class="muted">'+Safety.num(x.quantity)+' unidades • '+x.seller_username+(x.institution?' • '+x.institution:'')+'</p><div class="price">'+Safety.hc(x.price)+'</div><p class="muted">'+(x.description||"Sem observações adicionais.")+'</p>'+(featured?'<p class="muted">Destaque até '+Safety.date(x.featured_until)+'</p>':'')+'<footer class="actions">'+actions+'</footer></article>';
 }).join(""):'<div class="card"><p class="muted">Nenhuma oferta disponível.</p></div>'
}
async function buy(id){
 if(!confirm("Confirmar compra? O valor ficará em custódia. A taxa da Safety é descontada do vendedor quando a operação for concluída."))return;
 try{const{data,error}=await Safety.db().rpc("direct_purchase",{p_listing_id:id});if(error)throw error;alert("Transação #"+data+" criada em custódia.");location.href="transacoes.html"}catch(e){alert("Erro: "+e.message)}
}
async function counter(id){
 const v=prompt("Valor total da contraproposta em HC:");if(!v)return;
 const amount=Number(String(v).replace(/\D/g,""));if(!amount)return alert("Valor inválido.");
 try{const{error}=await Safety.db().rpc("place_offer",{p_listing_id:id,p_amount:amount});if(error)throw error;alert("Contraproposta enviada.");location.href="negociacoes.html"}catch(e){alert("Erro: "+e.message)}
}
async function promote(id){
 const feat=fees.featured_listing;if(!feat)return;
 if(!confirm("Destacar este anúncio por "+feat.duration_hours+"h por "+Safety.hc(feat.fixed_amount)+"? O valor será enviado à Tesouraria da Safety."))return;
 try{const{data,error}=await Safety.db().rpc("promote_listing",{p_listing_id:id});if(error)throw error;alert("Anúncio em destaque até "+Safety.date(data)+".");load()}catch(e){alert("Erro: "+e.message)}
}
filter.onchange=render;reload.onclick=load;load();
</script></body></html>
