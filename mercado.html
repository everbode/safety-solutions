<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercado | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html">SAFETY <span>SOLUTIONS</span></a><nav class="navlinks"><a class="btn small" href="dashboard.html">Painel</a><a class="btn small" href="negociacoes.html">Negociações</a><a class="btn primary small" href="nova-oferta.html">+ Oferta</a></nav></div></header><main class="container"><div class="page-title"><span class="eyebrow">MERCADO</span><h1>🛒 Ofertas abertas</h1><p class="muted">Compra direta ou contraproposta. O pagamento entra em custódia quando uma operação é fechada.</p></div><div id="msg" class="notice hidden"></div><div class="inline" style="margin-bottom:22px"><select id="filter" style="max-width:240px"><option value="">Todos os produtos</option><option>Ouro</option><option>Petróleo</option><option>Couro</option><option>TRM</option></select><button class="btn" id="reload">Atualizar</button></div><div id="market" class="grid cols3"></div></main><script>let rows=[];async function load(){try{const db=Safety.db();await Safety.requireUser();const{data,error}=await db.rpc("market_listings");if(error)throw error;rows=data||[];render()}catch(err){if(err.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else if(err.message!=="AUTH_REQUIRED")Safety.msg(msg,"❌ "+err.message,"error")}}function render(){const f=filter.value;const list=rows.filter(x=>!f||x.product===f);market.innerHTML=list.length?list.map(x=>'<article class="card market-card"><span class="tag '+(x.status==="available"?"ok":"warn")+'">'+x.status+'</span><h3>'+x.product+'</h3><p class="muted">'+Safety.num(x.quantity)+' unidades • '+x.seller_username+(x.institution?' • '+x.institution:'')+'</p><div class="price">'+Safety.hc(x.price)+'</div><p class="muted">'+(x.description||"Sem observações adicionais.")+'</p><footer><button class="btn primary small" onclick="buy('+x.id+')">Comprar</button><button class="btn small" onclick="counter('+x.id+')">Contraproposta</button></footer></article>').join(""):'<div class="card"><p class="muted">Nenhuma oferta disponível.</p></div>'}async function buy(id){if(!confirm("Confirmar compra? O valor ficará em custódia."))return;try{const{data,error}=await Safety.db().rpc("direct_purchase",{p_listing_id:id});if(error)throw error;alert("Transação #"+data+" criada em custódia.");location.href="transacoes.html"}catch(e){alert("Erro: "+e.message)}}async function counter(id){const v=prompt("Valor total da contraproposta em HC:");if(!v)return;const amount=Number(String(v).replace(/\D/g,""));if(!amount)return alert("Valor inválido.");try{const{error}=await Safety.db().rpc("place_offer",{p_listing_id:id,p_amount:amount});if(error)throw error;alert("Contraproposta enviada.");location.href="negociacoes.html"}catch(e){alert("Erro: "+e.message)}}filter.onchange=render;reload.onclick=load;load();</script></body></html>
