<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">SAFETY <span>SOLUTIONS</span></a><a class="btn small" href="login.html">Entrar</a></div></header><main class="container"><div class="form-card panel"><span class="eyebrow">NOVO CADASTRO</span><h1>👤 Criar conta</h1><p class="muted">Cadastre sua instituição para operar na Safety Solutions.</p><div id="msg" class="notice hidden"></div><form id="form" class="form-grid"><div><label>Nome de usuário</label><input id="username" required minlength="3" maxlength="40"></div><div><label>Tipo de usuário</label><select id="user_type" required><option value="">Selecione</option><option value="industry">🏭 Indústria</option><option value="reseller">📦 Revendedora</option><option value="financial">🏦 Financeira</option><option value="government">🏛️ Representante governamental</option></select></div><div class="full"><label>Link do perfil no jogo</label><input id="game_profile" type="url" placeholder="https://..." required></div><div><label>Instituição / grupo</label><input id="institution" required maxlength="80"></div><div><label>País no jogo</label><input id="country" required maxlength="60"></div><div class="full"><label>Cargo / função</label><input id="position" required maxlength="80"></div><div><label>E-mail</label><input id="email" type="email" required></div><div><label>Senha</label><input id="password" type="password" minlength="6" required></div><div class="full"><button class="btn primary" id="submit" type="submit">Criar conta</button></div></form><div class="notice"><b>🏛️ Contas governamentais</b><br>Representantes governamentais entram como “aguardando verificação” até aprovação da moderação.</div></div></main><script>const form=document.getElementById("form"),msg=document.getElementById("msg"),submit=document.getElementById("submit");form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;submit.textContent="Criando...";try{const db=Safety.db();const type=document.getElementById("user_type").value;const metadata={username:username.value.trim(),game_profile:game_profile.value.trim(),user_type:type,institution:institution.value.trim(),country:country.value.trim(),position:position.value.trim()};const{error}=await db.auth.signUp({email:email.value.trim(),password:password.value,options:{data:metadata}});if(error)throw error;Safety.msg(msg,type==="government"?"✅ Conta criada. Confirme o e-mail; depois o cadastro governamental ficará aguardando verificação.":"✅ Conta criada. Confira seu e-mail para confirmar o cadastro.","success");form.reset()}catch(err){if(err.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else Safety.msg(msg,"❌ "+err.message,"error")}finally{submit.disabled=false;submit.textContent="Criar conta"}});</script></body></html>
