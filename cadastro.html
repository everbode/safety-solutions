<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">SAFETY <span>SOLUTIONS</span></a><a class="btn small" href="login.html">Entrar</a></div></header><main class="container"><div class="form-card panel"><span class="eyebrow">NOVO CADASTRO</span><h1>👤 Criar conta</h1><p class="muted">Cadastre seu perfil para operar na Safety Solutions.</p><div id="msg" class="notice hidden"></div><form id="form" class="form-grid"><div><label>Nome de usuário</label><input id="username" required minlength="3" maxlength="40"></div><div><label>Tipo de usuário</label><select id="user_type" required><option value="">Selecione</option><option value="industry">🏭 Indústria</option><option value="reseller">📦 Revendedora</option><option value="financial">🏦 Financeira</option><option value="government">🏛️ Representante governamental</option></select></div><div class="full"><label>Link do perfil no jogo</label><input id="game_profile" type="url" placeholder="https://..." required></div><div class="full"><label id="entity_label">Instituição / grupo</label><select id="entity_select" required disabled><option value="">Selecione primeiro o tipo de usuário</option></select><input id="entity_custom" class="hidden" maxlength="80" placeholder=""></div><div class="full"><label>Cargo / função</label><input id="position" required maxlength="80"></div><div><label>E-mail</label><input id="email" type="email" required></div><div><label>Senha</label><input id="password" type="password" minlength="6" required></div><div class="full"><button class="btn primary" id="submit" type="submit">Criar conta</button></div></form><div class="notice"><b>🏛️ Contas governamentais</b><br>Para representantes governamentais, o campo acima solicita apenas o país representado. Essas contas ficam aguardando verificação da moderação.</div></div></main><script>
const form=document.getElementById("form"),msg=document.getElementById("msg"),submit=document.getElementById("submit");
const typeField=document.getElementById("user_type"),entitySelect=document.getElementById("entity_select"),entityCustom=document.getElementById("entity_custom"),entityLabel=document.getElementById("entity_label");

/* Listas prontas para receber as opções oficiais do RP. */
const institutionOptions=[];
const countryOptions=[];

function setupEntityField(){
  const type=typeField.value;
  entityCustom.classList.add("hidden");
  entityCustom.required=false;
  entityCustom.value="";
  entitySelect.classList.remove("hidden");

  if(!type){
    entityLabel.textContent="Instituição / grupo";
    entitySelect.disabled=true;
    entitySelect.innerHTML='<option value="">Selecione primeiro o tipo de usuário</option>';
    return;
  }

  const government=type==="government";
  const options=government?countryOptions:institutionOptions;
  entityLabel.textContent=government?"País representado":"Instituição / grupo";
  entitySelect.disabled=false;

  const placeholder=government?"Selecione o país":"Selecione a instituição / grupo";
  const manual=government?"__custom__|Outro país / não listado":"__custom__|Outra instituição / grupo";

  entitySelect.innerHTML='<option value="">'+placeholder+'</option>'+
    options.map(x=>'<option value="'+x+'">'+x+'</option>').join("")+
    '<option value="'+manual.split("|")[0]+'">'+manual.split("|")[1]+'</option>';
}

entitySelect.addEventListener("change",()=>{
  if(entitySelect.value==="__custom__"){
    entitySelect.classList.add("hidden");
    entityCustom.classList.remove("hidden");
    entityCustom.required=true;
    entityCustom.placeholder=typeField.value==="government"?"Digite o nome do país":"Digite o nome da instituição / grupo";
    entityCustom.focus();
  }
});

typeField.addEventListener("change",setupEntityField);
setupEntityField();

form.addEventListener("submit",async e=>{
  e.preventDefault();
  submit.disabled=true;
  submit.textContent="Criando...";
  try{
    const db=Safety.db();
    const type=typeField.value;
    const entityName=(entitySelect.value==="__custom__"?entityCustom.value:entitySelect.value).trim();
    if(!entityName) throw new Error(type==="government"?"Selecione ou informe o país.":"Selecione ou informe a instituição / grupo.");

    const metadata={
      username:username.value.trim(),
      game_profile:game_profile.value.trim(),
      user_type:type,
      institution:type==="government"?null:entityName,
      country:type==="government"?entityName:null,
      position:position.value.trim()
    };

    const{error}=await db.auth.signUp({
      email:email.value.trim(),
      password:password.value,
      options:{data:metadata}
    });
    if(error)throw error;

    Safety.msg(msg,type==="government"
      ?"✅ Conta criada. Confirme o e-mail; depois o cadastro governamental ficará aguardando verificação."
      :"✅ Conta criada. Confira seu e-mail para confirmar o cadastro.","success");
    form.reset();
    setupEntityField();
  }catch(err){
    if(err.message==="CONFIG_PENDENTE")Safety.configNotice(msg);
    else Safety.msg(msg,"❌ "+err.message,"error");
  }finally{
    submit.disabled=false;
    submit.textContent="Criar conta";
  }
});
</script></body></html>
