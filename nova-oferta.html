<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova oferta | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html">SAFETY <span>SOLUTIONS</span></a><nav class="navlinks"><a class="btn small" href="mercado.html">Mercado</a><a class="btn small" href="dashboard.html">Painel</a></nav></div></header><main class="container"><div class="form-card panel"><span class="eyebrow">ANÚNCIO</span><h1>➕ Nova oferta</h1><p class="muted">Publique um lote de no mínimo 100.000 unidades.</p><div id="msg" class="notice hidden"></div><form id="form" class="form-grid"><div><label>Produto</label><select id="product" required><option value="">Selecione</option><option>Ouro</option><option>Petróleo</option><option>Couro</option><option>TRM</option></select></div><div><label>Quantidade</label><input id="quantity" type="number" min="100000" step="1" required></div><div><label>Preço total em HC</label><input id="price" type="number" min="1" step="1" required></div><div><label>Prazo</label><input id="deadline" type="date"></div><div class="full"><label>Descrição / condições</label><textarea id="description" maxlength="1000" placeholder="Detalhes da entrega, condições e observações..."></textarea></div><div class="full"><button class="btn primary" id="submit">Publicar oferta</button></div></form><div class="notice"><b>🔐 Segurança:</b> ao fechar uma compra, o HubCredit do comprador é debitado e permanece em custódia até a confirmação da operação.</div></div></main><script>let currentUser;async function init(){try{const db=Safety.db();currentUser=await Safety.requireUser();const{data:p}=await db.from("profiles").select("account_status").eq("id",currentUser.id).single();if(p?.account_status!=="active"){Safety.msg(msg,"Sua conta ainda não está ativa para publicar ofertas.","error");submit.disabled=true}}catch(e){if(e.message==="CONFIG_PENDENTE")Safety.configNotice(msg)}}form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;try{const db=Safety.db();const payload={seller_id:currentUser.id,product:product.value,quantity:Number(quantity.value),price:Number(price.value),deadline:deadline.value||null,description:description.value.trim(),status:"available"};const{error}=await db.from("listings").insert(payload);if(error)throw error;Safety.msg(msg,"✅ Oferta publicada com sucesso.","success");form.reset();setTimeout(()=>location.href="mercado.html",700)}catch(err){Safety.msg(msg,"❌ "+err.message,"error");submit.disabled=false}});init();</script></body></html>
