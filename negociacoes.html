<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negociações | Safety Solutions</title><link rel="stylesheet" href="styles.css?v=mobile-layout-20261002"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="config.js"></script><script src="app.js?v=mobile-layout-20261002"></script><script src="i18n.js?v=mobile-layout-20261002"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html">SAFETY <span>SOLUTIONS</span></a><nav class="navlinks"><a class="btn small" href="mercado.html">Mercado</a><a class="btn small" href="transacoes.html">Transações</a><a class="btn small" href="dashboard.html">Painel</a></nav></div></header><main class="container"><div class="page-title"><span class="eyebrow">NEGOCIAÇÕES</span><h1>🤝 Contrapropostas</h1><p class="muted">Acompanhe propostas enviadas e recebidas antes da criação da custódia.</p></div><div id="msg" class="notice hidden"></div><div id="feeNotice" class="notice"></div><div id="list" class="grid cols2"></div></main><script>
let marketFee=0;
async function load(){
 try{
  const db=Safety.db();await Safety.requireUser();
  const[{data,error},{data:feeData,error:feeErr}]=await Promise.all([db.rpc("my_offers"),db.rpc("platform_fee_schedule")]);
  if(error)throw error;if(feeErr)throw feeErr;
  const setting=(feeData||[]).find(x=>x.fee_key==="market_transaction");marketFee=setting?.rate_bps||0;
  feeNotice.textContent=marketFee?"💼 Quando uma negociação for concluída, "+(marketFee/100).toLocaleString("pt-BR")+"% será descontado do valor recebido pelo vendedor e enviado à Tesouraria da Safety.":"";
  const rows=data||[];
  list.innerHTML=rows.length?rows.map(o=>{
   const seller=o.my_role==="seller";let buttons="";
   if(seller&&o.offer_status==="pending")buttons='<button class="btn primary small" onclick="acceptOffer('+o.offer_id+')">Aceitar</button><button class="btn small" onclick="counter('+o.offer_id+')">Contrapropor</button><button class="btn danger small" onclick="rejectOffer('+o.offer_id+')">Recusar</button>';
   if(!seller&&o.offer_status==="countered")buttons='<button class="btn primary small" onclick="acceptCounter('+o.offer_id+')">Aceitar '+Safety.hc(o.counter_amount)+'</button>';
   const feePreview=seller&&["pending","countered"].includes(o.offer_status)&&marketFee?'<p class="muted">Se concluída: taxa prevista '+(marketFee/100).toLocaleString("pt-BR")+'%.</p>':"";
   return '<article class="card"><div class="inline"><span class="tag">'+Safety.escapeHtml(o.offer_status)+'</span><span class="muted">'+(seller?"recebida":"enviada")+'</span></div><h3>'+Safety.escapeHtml(o.product)+' • '+Safety.num(o.quantity)+' un.</h3><p class="muted">'+(seller?"Comprador: ":"Vendedor: ")+Safety.escapeHtml(o.other_username)+(o.other_institution?' • '+Safety.escapeHtml(o.other_institution):'')+'</p><p>Preço anunciado: <b>'+Safety.hc(o.asking_price)+'</b><br>Proposta: <b class="gold">'+Safety.hc(o.offer_amount)+'</b>'+(o.counter_amount?'<br>Contraproposta do vendedor: <b>'+Safety.hc(o.counter_amount)+'</b>':'')+'</p>'+feePreview+'<div class="actions">'+buttons+'</div></article>';
  }).join(""):'<div class="card"><p class="muted">Nenhuma negociação registrada.</p></div>'
 }catch(e){if(e.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else if(e.message!=="AUTH_REQUIRED")Safety.msg(msg,"❌ "+e.message,"error")}
}
async function acceptOffer(id){if(!confirm("Aceitar esta proposta? O valor do comprador será colocado em custódia e a taxa da Safety só será cobrada na conclusão."))return;try{const{data,error}=await Safety.db().rpc("accept_offer",{p_offer_id:id});if(error)throw error;alert("Transação #"+data+" criada.");location.href="transacoes.html"}catch(e){alert("Erro: "+e.message)}}
async function rejectOffer(id){try{const{error}=await Safety.db().rpc("respond_offer",{p_offer_id:id,p_action:"reject",p_counter_amount:null});if(error)throw error;load()}catch(e){alert("Erro: "+e.message)}}
async function counter(id){const v=prompt("Novo valor total em HC:");if(!v)return;const amount=Number(String(v).replace(/\D/g,""));if(!amount)return alert("Valor inválido.");try{const{error}=await Safety.db().rpc("respond_offer",{p_offer_id:id,p_action:"counter",p_counter_amount:amount});if(error)throw error;load()}catch(e){alert("Erro: "+e.message)}}
async function acceptCounter(id){if(!confirm("Aceitar contraproposta e colocar o valor em custódia? A taxa da Safety será descontada do vendedor somente na conclusão."))return;try{const{data,error}=await Safety.db().rpc("accept_counteroffer",{p_offer_id:id});if(error)throw error;alert("Transação #"+data+" criada.");location.href="transacoes.html"}catch(e){alert("Erro: "+e.message)}}
load();
</script></body></html>
