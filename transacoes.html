<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transações | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="config.js"></script><script src="app.js"></script><script src="i18n.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html">SAFETY <span>SOLUTIONS</span></a><nav class="navlinks"><a class="btn small" href="mercado.html">Mercado</a><a class="btn small" href="negociacoes.html">Negociações</a><a class="btn small" href="dashboard.html">Painel</a></nav></div></header><main class="container"><div class="page-title"><span class="eyebrow">CUSTÓDIA E HISTÓRICO</span><h1>🔐 Transações</h1><p class="muted">O comprador libera o pagamento após confirmar a conclusão no jogo. A taxa da Safety é cobrada apenas quando o valor é liberado ao vendedor.</p></div><div id="msg" class="notice hidden"></div><div id="list" class="grid cols2"></div></main><script>
async function load(){
 try{
  const db=Safety.db();await Safety.requireUser();
  const{data,error}=await db.rpc("my_transactions");if(error)throw error;
  const rows=data||[];
  list.innerHTML=rows.length?rows.map(t=>{
    let controls="";
    if(t.my_role==="buyer"&&t.status==="custody")controls='<button class="btn primary small" onclick="confirmTx('+t.id+')">✅ Confirmar e liberar</button><button class="btn danger small" onclick="dispute('+t.id+')">⚖️ Abrir disputa</button>';
    const gameUrl=Safety.safeUrl(t.counterpart_game_profile);const profile=gameUrl?'<a class="btn small" target="_blank" rel="noopener" href="'+Safety.escapeHtml(gameUrl)+'">Perfil no jogo ↗</a>':"";
    const rate=(t.fee_rate_bps||0)/100;
    let feeLine="";
    if(t.my_role==="seller"&&t.fee_rate_bps>0){
      if(t.seller_net_amount!=null&&["completed","resolved"].includes(t.status)) feeLine='<p class="muted">Taxa Safety: '+Safety.hc(t.platform_fee)+' ('+rate.toLocaleString("pt-BR")+'%) • Líquido recebido: <b>'+Safety.hc(t.seller_net_amount)+'</b></p>';
      else feeLine='<p class="muted">Taxa prevista na conclusão: '+rate.toLocaleString("pt-BR")+'%.</p>';
    }
    return '<article class="card"><div class="inline"><span class="tag">'+Safety.escapeHtml(t.status)+'</span><span class="muted">#'+t.id+'</span></div><h3>'+Safety.escapeHtml(t.product)+' • '+Safety.num(t.quantity)+' un.</h3><p class="muted">'+(t.my_role==="buyer"?"Vendedor: ":"Comprador: ")+Safety.escapeHtml(t.counterpart_username)+(t.counterpart_institution?' • '+Safety.escapeHtml(t.counterpart_institution):'')+'</p><div class="stat gold">'+Safety.hc(t.amount)+'</div>'+feeLine+'<p class="muted">Criada em '+Safety.date(t.created_at)+'</p><div class="actions">'+profile+controls+'</div></article>';
  }).join(""):'<div class="card"><p class="muted">Nenhuma transação registrada.</p></div>'
 }catch(e){if(e.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else if(e.message!=="AUTH_REQUIRED")Safety.msg(msg,"❌ "+e.message,"error")}
}
async function confirmTx(id){if(!confirm("Confirma que a operação foi concluída? O HC líquido será liberado ao vendedor e a taxa da Safety irá para a Tesouraria."))return;try{const{error}=await Safety.db().rpc("confirm_transaction",{p_transaction_id:id});if(error)throw error;alert("Pagamento liberado ao vendedor.");load()}catch(e){alert("Erro: "+e.message)}}
async function dispute(id){const reason=prompt("Descreva o problema. Informe fatos e evidências disponíveis:");if(!reason)return;try{const{error}=await Safety.db().rpc("open_dispute",{p_transaction_id:id,p_reason:reason});if(error)throw error;alert("Disputa aberta. O valor seguirá bloqueado para análise.");load()}catch(e){alert("Erro: "+e.message)}}
load();
</script></body></html>
