<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leilões | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html">SAFETY <span>SOLUTIONS</span></a><nav class="navlinks"><a class="btn small" href="dashboard.html">Painel</a><a class="btn small" href="mercado.html">Mercado</a><a class="btn small" href="licitacoes.html">Licitações</a></nav></div></header><main class="container"><div class="page-title"><span class="eyebrow">LEILÕES</span><h1>🔨 Leilões de alto valor</h1><p class="muted">O maior lance válido fica reservado em HC. Quando um lance é superado, a reserva anterior é devolvida automaticamente.</p></div><div id="msg" class="notice hidden"></div><div class="panel" style="margin-bottom:28px"><h2>Criar leilão</h2><form id="createForm" class="form-grid"><div><label>Produto</label><select id="product" required><option>Ouro</option><option>Petróleo</option><option>Couro</option><option>TRM</option></select></div><div><label>Quantidade</label><input id="quantity" type="number" min="100000" required></div><div><label>Lance inicial (HC)</label><input id="starting" type="number" min="1" required></div><div><label>Incremento mínimo (HC)</label><input id="increment" type="number" min="1" required></div><div><label>Encerra em</label><input id="ends" type="datetime-local" required></div><div class="full"><label>Condições</label><textarea id="conditions"></textarea></div><div class="full"><button class="btn primary">Publicar leilão</button></div></form></div><div class="section-head"><span class="gold">ATIVOS E HISTÓRICO</span><h2>Leilões</h2></div><div id="list" class="grid cols3"></div></main><script>let me=null;async function load(){try{const db=Safety.db();me=await Safety.requireUser();const{data,error}=await db.rpc("auction_feed");if(error)throw error;list.innerHTML=(data||[]).length?(data||[]).map(a=>{const current=a.winning_bid||a.starting_bid;const ended=new Date(a.ends_at)<=new Date();let actions="";if(a.status==="open"&&!ended&&a.seller_id!==me.id)actions='<button class="btn primary small" onclick="bid('+a.id+','+current+','+a.min_increment+','+(a.winning_bid?"true":"false")+')">Dar lance</button>';if(a.status==="open"&&ended&&a.seller_id===me.id)actions='<button class="btn primary small" onclick="closeAuction('+a.id+')">Finalizar leilão</button>';return '<article class="card"><div class="inline"><span class="tag '+(a.status==="open"?"ok":"")+'">'+a.status+'</span><span class="muted">#'+a.id+'</span></div><h3>'+a.product+' • '+Safety.num(a.quantity)+' un.</h3><p class="muted">Vendedor: '+a.seller_username+(a.institution?' • '+a.institution:'')+'</p><p>Lance inicial: <b>'+Safety.hc(a.starting_bid)+'</b><br>Maior lance: <b class="gold">'+(a.winning_bid?Safety.hc(a.winning_bid):"ainda não há")+'</b><br>Incremento: '+Safety.hc(a.min_increment)+'</p><p class="muted">Encerra: '+Safety.date(a.ends_at)+'</p><p class="muted">'+(a.conditions||"Sem condições adicionais.")+'</p><div class="actions">'+actions+'</div></article>'}).join(""):'<div class="card"><p class="muted">Nenhum leilão criado.</p></div>'}catch(e){if(e.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else if(e.message!=="AUTH_REQUIRED")Safety.msg(msg,"❌ "+e.message,"error")}}createForm.addEventListener("submit",async e=>{e.preventDefault();try{const payload={seller_id:me.id,product:product.value,quantity:Number(quantity.value),starting_bid:Number(starting.value),min_increment:Number(increment.value),ends_at:new Date(ends.value).toISOString(),conditions:conditions.value.trim()};const{error}=await Safety.db().from("auctions").insert(payload);if(error)throw error;createForm.reset();load()}catch(e){alert("Erro: "+e.message)}});async function bid(id,current,inc,hasBid){const minimum=hasBid?current+inc:current;const v=prompt("Lance mínimo: "+Safety.hc(minimum));if(!v)return;const amount=Number(String(v).replace(/\D/g,""));try{const{error}=await Safety.db().rpc("place_auction_bid",{p_auction_id:id,p_amount:amount});if(error)throw error;load()}catch(e){alert("Erro: "+e.message)}}async function closeAuction(id){try{const{data,error}=await Safety.db().rpc("close_auction",{p_auction_id:id});if(error)throw error;alert(data?"Leilão finalizado. Transação #"+data+" criada em custódia.":"Leilão finalizado sem lances.");load()}catch(e){alert("Erro: "+e.message)}}load();</script></body></html>
