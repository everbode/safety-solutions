<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Erros | Safety Solutions</title><link rel="stylesheet" href="styles.css?v=ads-20261002"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="config.js"></script><script src="app.js?v=ads-20261002"></script><script src="i18n.js"></script><style>
.error-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.error-card{padding:16px}.error-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--gold);font-weight:900}.error-list{display:grid;gap:12px}.error-row{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.error-row.open{border-left:4px solid var(--danger)}.error-row.resolved{border-left:4px solid var(--ok)}.mini{font-size:12px}.tech{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;background:#090d12;border:1px solid var(--line);padding:10px;border-radius:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{max-width:340px}@media(max-width:900px){.error-grid{grid-template-columns:1fr 1fr}}@media(max-width:640px){.error-grid{grid-template-columns:1fr}}</style></head><body>
<header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html">SAFETY <span>SOLUTIONS</span></a><nav class="navlinks"><a class="btn small" href="admin.html">Admin</a><a class="btn small" href="dashboard.html">Painel</a><button class="btn small" onclick="Safety.logout()">Sair</button></nav></div></header>
<main class="container"><div class="page-title"><span class="eyebrow">DIAGNÓSTICO</span><h1>🧩 Central de erros</h1><p class="muted">Os usuários recebem um código, uma orientação e um protocolo. Ocorrências de usuários autenticados são registradas aqui para análise da equipe.</p></div><div id="msg" class="notice hidden"></div><div id="content" class="hidden">
<section class="section" style="padding-top:10px"><div class="section-head"><span class="gold">CATÁLOGO</span><h2>Códigos de erro</h2></div><div id="catalog" class="error-grid"></div></section>
<section class="section" style="padding-top:20px"><div class="section-head"><span class="gold">OCORRÊNCIAS</span><h2>Erros registrados</h2></div><div class="toolbar"><input id="search" placeholder="Buscar código, protocolo, usuário ou página..."><select id="statusFilter"><option value="">Todos</option><option value="open">Abertos</option><option value="resolved">Resolvidos</option></select><button class="btn" onclick="load()">Atualizar</button></div><div id="list" class="error-list"></div></section>
</div></main>
<script>
let rows=[],level=0;const LEVEL={auditor:10,moderator:20,admin:30,owner:40};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function load(){
 try{
  const db=Safety.db(),u=await Safety.requireUser();
  const{data:mod}=await db.from("moderators").select("role").eq("user_id",u.id).maybeSingle();
  level=LEVEL[mod?.role]||0;if(level<10){Safety.msg(msg,"⛔ Acesso restrito à equipe administrativa.","error");return}
  content.classList.remove("hidden");
  const{data,error}=await db.rpc("admin_error_reports_feed",{p_limit:300});if(error)throw error;
  rows=data||[];renderCatalog();render();
 }catch(e){if(e.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else if(e.message!=="AUTH_REQUIRED")Safety.errorMsg(msg,e,"error-center-load")}
}
function renderCatalog(){
 catalog.innerHTML=Object.entries(Safety.errorCatalog).map(([code,item])=>'<article class="card error-card"><div class="error-code">'+esc(code)+'</div><h3>'+esc(item.title)+'</h3><p class="muted">'+esc(item.action)+'</p></article>').join("");
}
function render(){
 const q=(search.value||"").toLowerCase(),sf=statusFilter.value;
 const filtered=rows.filter(x=>(!sf||x.status===sf)&&(!q||[x.error_code,x.incident_key,x.username,x.page,x.context,x.technical_message].join(" ").toLowerCase().includes(q)));
 list.innerHTML=filtered.length?filtered.map(x=>'<article class="error-row '+x.status+'"><div class="inline"><span class="tag '+(x.status==="open"?"danger":"ok")+'">'+esc(x.status)+'</span><span class="error-code">'+esc(x.error_code)+'</span><b>'+esc(x.incident_key)+'</b></div><p><b>Usuário:</b> '+esc(x.username||"—")+' • <b>Página:</b> '+esc(x.page||"—")+' • <b>Contexto:</b> '+esc(x.context||"—")+'</p><p class="muted mini">'+Safety.date(x.created_at)+(x.resolved_at?' • resolvido '+Safety.date(x.resolved_at):'')+'</p><div class="tech">'+esc(x.technical_message||"Sem detalhe técnico")+'</div>'+(x.resolution_note?'<p><b>Resolução:</b> '+esc(x.resolution_note)+'</p>':'')+(x.status==="open"&&level>=20?'<div class="actions"><button class="btn primary small" onclick="resolveError('+x.id+')">Marcar como resolvido</button></div>':'')+'</article>').join(""):'<div class="card"><p class="muted">Nenhum erro encontrado.</p></div>';
}
async function resolveError(id){
 const note=prompt("O que foi feito para resolver este erro?");if(!note)return;
 try{const{error}=await Safety.db().rpc("moderator_resolve_error_report",{p_id:id,p_note:note});if(error)throw error;await load()}catch(e){Safety.errorAlert(e,"resolve-error-report")}
}
search.oninput=render;statusFilter.onchange=render;load();
</script></body></html>
