<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html">SAFETY <span>SOLUTIONS</span></a><a class="btn small" href="dashboard.html">Painel</a></div></header><main class="container"><div class="form-card panel"><span class="eyebrow">MINHA CONTA</span><h1>👤 Perfil</h1><div id="msg" class="notice hidden"></div><form id="form" class="form-grid"><div><label>Usuário</label><input id="username" required></div><div><label>Tipo</label><input id="user_type" disabled></div><div class="full"><label>Perfil no jogo</label><input id="game_profile" type="url" required></div><div><label>Instituição</label><input id="institution" required></div><div><label>País</label><input id="country" required></div><div><label>Cargo</label><input id="position" required></div><div><label>Status da conta</label><input id="account_status" disabled></div><div class="full"><button class="btn primary" id="save">Salvar alterações</button></div></form></div></main><script>let user;async function init(){try{const db=Safety.db();user=await Safety.requireUser();const{data:p,error}=await db.from("profiles").select("*").eq("id",user.id).single();if(error)throw error;username.value=p.username||"";user_type.value=p.user_type||"";game_profile.value=p.game_profile||"";institution.value=p.institution||"";country.value=p.country||"";position.value=p.position||"";account_status.value=p.account_status||""}catch(e){if(e.message==="CONFIG_PENDENTE")Safety.configNotice(msg)}}form.addEventListener("submit",async e=>{e.preventDefault();try{const{error}=await Safety.db().from("profiles").update({username:username.value.trim(),game_profile:game_profile.value.trim(),institution:institution.value.trim(),country:country.value.trim(),position:position.value.trim()}).eq("id",user.id);if(error)throw error;Safety.msg(msg,"✅ Perfil atualizado.","success")}catch(e){Safety.msg(msg,"❌ "+e.message,"error")}});init();</script></body></html>
