<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script src="i18n.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">SAFETY <span>SOLUTIONS</span></a><a class="btn small" href="cadastro.html">Cadastrar</a></div></header><main class="container"><div class="form-card panel" style="max-width:520px"><span class="eyebrow">ÁREA SEGURA</span><h1>🔐 Entrar</h1><p class="muted">Acesse sua conta para negociar, acompanhar custódias e consultar seu histórico.</p><div id="msg" class="notice hidden"></div><form id="form"><label>E-mail</label><input id="email" type="email" required><label style="margin-top:14px">Senha</label><input id="password" type="password" required><button class="btn primary" style="width:100%;margin-top:18px" id="submit">Entrar</button></form><div class="divider"></div><p class="muted">Ainda não tem conta? <a class="gold" href="cadastro.html">Criar cadastro</a></p></div></main><script>form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;submit.textContent="Entrando...";try{const db=Safety.db();const{error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;location.href="dashboard.html"}catch(err){if(err.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else Safety.msg(msg,"❌ "+err.message,"error")}finally{submit.disabled=false;submit.textContent="Entrar"}});</script></body></html>
