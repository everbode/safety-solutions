<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico comercial | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html">SAFETY <span>SOLUTIONS</span></a><nav class="navlinks"><a class="btn small" href="dashboard.html">Painel</a><a class="btn small" href="analytics.html">Analytics</a></nav></div></header><main class="container"><div class="page-title"><span class="eyebrow">HISTÓRICO OBJETIVO</span><h1>🏢 Instituições e usuários</h1><p class="muted">Sem notas subjetivas: apenas operações concluídas, disputas, alertas verificados e volume registrado.</p></div><div id="msg" class="notice hidden"></div><section class="sponsor-zone"><span class="sponsor-label">Patrocinado</span><div data-sponsor-placement="general"></div></section><div class="inline" style="margin-bottom:22px"><input id="search" placeholder="Buscar usuário, instituição ou país..." style="max-width:420px"></div><div id="feed" class="grid cols3"></div></main><script>let data=[];function render(){const q=search.value.toLowerCase().trim();const d=data.filter(x=>!q||[x.username,x.institution,x.country,x.user_type].join(" ").toLowerCase().includes(q));feed.innerHTML=d.length?d.map(x=>'<article class="card"><span class="tag">'+x.user_type+'</span><h3>'+x.username+'</h3><p class="muted">'+(x.institution||"Sem instituição")+' • '+(x.country||"—")+'</p><div class="divider"></div><p>Operações concluídas: <b>'+Safety.num(x.completed_transactions)+'</b><br>Disputas registradas: <b>'+Safety.num(x.disputes)+'</b><br>Alertas ativos/contestados: <b>'+Safety.num(x.active_alerts)+'</b><br>Volume: <b class="gold">'+Safety.hc(x.total_volume_hc)+'</b></p></article>').join(""):'<div class="card"><p class="muted">Nenhum resultado.</p></div>'}search.oninput=render;(async()=>{try{const db=Safety.db();await Safety.requireUser();const{data:d,error}=await db.rpc("profile_directory");if(error)throw error;data=d||[];render()}catch(e){if(e.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else if(e.message!=="AUTH_REQUIRED")Safety.msg(msg,"❌ "+e.message,"error")}})();</script></body></html>
