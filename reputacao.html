<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico comercial | Safety Solutions</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script src="i18n.js"></script><style>.biz-card{display:flex;flex-direction:column;gap:10px}.biz-head{display:flex;gap:12px;align-items:center}.biz-logo{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#0b1016;border:1px solid var(--line)}.biz-logo.ph{display:grid;place-items:center;color:var(--gold);font-weight:900}.mini{font-size:12px}</style></head><body>
<header class="topbar"><div class="container nav"><a class="brand" href="dashboard.html">SAFETY <span>SOLUTIONS</span></a><nav class="navlinks"><a class="btn small" href="rede.html">Rede</a><a class="btn small" href="contratos.html">Contratos</a><a class="btn small" href="dashboard.html">Painel</a><a class="btn small" href="analytics.html">Analytics</a></nav></div></header>
<main class="container"><div class="page-title"><span class="eyebrow">HISTÓRICO OBJETIVO</span><h1>🏢 Instituições e usuários</h1><p class="muted">Perfis comerciais persistentes, relações confirmadas e métricas objetivas da atividade na plataforma.</p></div><div id="msg" class="notice hidden"></div><section class="sponsor-zone"><span class="sponsor-label">Patrocinado</span><div data-sponsor-placement="general"></div></section>
<div class="inline" style="margin-bottom:22px"><input id="search" placeholder="Buscar usuário, instituição, país ou foco comercial..." style="max-width:480px"><select id="typeFilter" style="max-width:240px"><option value="">Todos os tipos</option><option value="industry">Fábrica / Indústria</option><option value="reseller">Revendedora</option><option value="financial">Financeira</option><option value="government">Representante governamental</option></select></div><div id="feed" class="grid cols3"></div></main>
<script>
let data=[];const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function logo(x){const u=Safety.safeUrl(x.logo_url);const label=x.institution||x.country||x.username;return u?'<img class="biz-logo" src="'+u+'" alt="" loading="lazy">':'<div class="biz-logo ph">'+esc(label.slice(0,1).toUpperCase())+'</div>'}
function render(){const q=search.value.toLowerCase().trim(),tf=typeFilter.value;const d=data.filter(x=>(!tf||x.user_type===tf)&&(!q||[x.username,x.institution,x.country,x.user_type,x.commercial_focus,x.bio].join(" ").toLowerCase().includes(q)));feed.innerHTML=d.length?d.map(x=>'<article class="card biz-card"><div class="biz-head">'+logo(x)+'<div><div class="inline"><span class="tag">'+esc(x.user_type)+'</span>'+(x.institutional_verified?'<span class="tag ok">✓ verificado</span>':'')+'</div><h3 style="margin:5px 0 0">'+esc(x.institution||x.country||x.username)+'</h3><div class="muted mini">'+esc(x.username)+'</div></div></div><p class="gold">'+esc(x.commercial_focus||"Foco comercial não informado.")+'</p><p class="muted">'+esc((x.bio||"Sem apresentação pública cadastrada.").slice(0,180))+'</p><div class="divider"></div><p class="mini">Operações: <b>'+Safety.num(x.completed_transactions)+'</b> • Parceiros: <b>'+Safety.num(x.partner_count)+'</b> • Contratos ativos: <b>'+Safety.num(x.active_contracts)+'</b><br>Disputas: <b>'+Safety.num(x.disputes)+'</b> • Alertas: <b>'+Safety.num(x.active_alerts)+'</b><br>Volume: <b class="gold">'+Safety.hc(x.total_volume_hc)+'</b></p><div class="actions"><a class="btn primary small" href="instituicao.html?id='+encodeURIComponent(x.id)+'">Ver perfil comercial</a></div></article>').join(""):'<div class="card"><p class="muted">Nenhum resultado.</p></div>'}
search.oninput=render;typeFilter.onchange=render;(async()=>{try{const db=Safety.db();await Safety.requireUser();const{data:d,error}=await db.rpc("business_directory");if(error)throw error;data=d||[];render()}catch(e){if(e.message==="CONFIG_PENDENTE")Safety.configNotice(msg);else if(e.message!=="AUTH_REQUIRED")Safety.errorMsg(msg,e,"business-directory")}})();
</script></body></html>
